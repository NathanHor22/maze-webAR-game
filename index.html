<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Maze Game</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="ar-canvas"></canvas>

  <!-- Scan prompt -->
  <div id="scan-prompt">
    <div class="scan-box">
      <div class="scan-icon">📷</div>
      <p>Point camera at the car card to start</p>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-item">
      <span class="hud-label">Score</span>
      <span id="score-counter" class="hud-value gold">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">Time</span>
      <span id="timer" class="hud-value teal">15</span>
    </div>
  </div>

  <!-- Win screen -->
  <div id="win-screen" class="end-screen" style="display:none">
    <div class="end-box">
      <h1>Great job!</h1>
      <p>You collected all the coins.</p>
      <button id="btn-play-again-win" class="end-btn">Play Again</button>
      <a href="https://www.synapzemy.com/" target="_blank" rel="noopener" class="built-by">
        <span>Built by the team at</span>
        <img src="/assets/targets/synapze-black-logo.png" alt="Synapze" />
      </a>
    </div>
  </div>

  <!-- Lose screen -->
  <div id="lose-screen" class="end-screen" style="display:none">
    <div class="end-box">
      <h1>Time's up!</h1>
      <p>Better luck next time!</p>
      <button id="btn-play-again-lose" class="end-btn">Try Again</button>
      <a href="https://www.synapzemy.com/" target="_blank" rel="noopener" class="built-by">
        <span>Built by the team at</span>
        <img src="/assets/targets/synapze-black-logo.png" alt="Synapze" />
      </a>
    </div>
  </div>

  <!-- Nav buttons -->
  <div class="controls-container">
    <button id="btn-up" class="control-btn"><span>▲</span></button>
    <div class="horizontal-controls">
      <button id="btn-left" class="control-btn"><span>◀</span></button>
      <button id="btn-down" class="control-btn"><span>▼</span></button>
      <button id="btn-right" class="control-btn"><span>▶</span></button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
