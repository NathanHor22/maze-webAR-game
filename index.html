<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Maze Game</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="ar-canvas"></canvas>

  <!-- Shown when image is not in view -->
  <div id="scan-prompt">
    <div class="scan-box">
      <div class="scan-icon">📷</div>
      <p>Point camera at the car card to start</p>
    </div>
  </div>

  <!-- Score -->
  <div id="score-display">
    <span>Score: </span><span id="score-counter">0</span>
  </div>

  <!-- Nav buttons -->
  <div class="controls-container">
    <button id="btn-up" class="control-btn"><span>▲</span></button>
    <div class="horizontal-controls">
      <button id="btn-left" class="control-btn"><span>◀</span></button>
      <button id="btn-down" class="control-btn"><span>▼</span></button>
      <button id="btn-right" class="control-btn"><span>▶</span></button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
